# Paid hosting proposal. Review current Render pricing before applying.
services:
  - type: web
    name: magnetic-mayhem
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/config
    disk:
      name: magnetic-mayhem-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: GAME_DB
        value: /var/data/game.sqlite3
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TEACHER_KEY
        sync: false
